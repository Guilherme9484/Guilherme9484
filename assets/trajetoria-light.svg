<svg xmlns="http://www.w3.org/2000/svg" width="820" height="1044" viewBox="0 0 820 1044" role="img" aria-label="Trajetória de Guilherme Cosme de 2017 até hoje, desenhada como a saída de git log --graph">
<style>
  .mono  { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
  .sans  { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
  .bar   { font: 500 12px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; fill: #818b98; }
  .cmd   { font: 500 13px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; fill: #1f2328; }
  .ps    { font: 700 13px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; fill: #1a7f37; }
  .sec   { font: 500 12px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; fill: #818b98; }
  .hash  { font: 500 12.5px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; fill: #9a6700; }
  .year  { font: 600 12.5px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; fill: #59636e; }
  .title { font: 600 16px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; fill: #1f2328; }
  .desc  { font: 400 13.5px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; fill: #59636e; }
  .chip  { font: 600 11px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
  .lane  { fill: none; stroke-width: 2.5; stroke-linecap: round; }

  .draw  { animation: draw 1.8s cubic-bezier(.65,0,.35,1) both; }
  .rv    { animation: rv .55s ease-out both; }
  .flow  { fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-dasharray: 40 1600;
            animation: flow 6s linear 2s infinite both; }
  .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2.4s ease-out 2s infinite both; }
  .caret { animation: blink 1.1s steps(1) infinite; }

  @keyframes draw  { from { stroke-dasharray: 1; stroke-dashoffset: 1; } to { stroke-dasharray: 1; stroke-dashoffset: 0; } }
  @keyframes rv    { from { opacity: 0; transform: translateX(-6px); } to { opacity: 1; transform: none; } }
  @keyframes flow  { from { stroke-dashoffset: 40; } to { stroke-dashoffset: -1600; } }
  @keyframes pulse { 0% { transform: scale(1); opacity: .5; } 100% { transform: scale(2.8); opacity: 0; } }
  @keyframes blink { 0%, 50% { opacity: 1; } 50.01%, 100% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) {
    .draw, .rv, .pulse, .caret { animation: none; }
    .flow { display: none; }
  }
</style>
